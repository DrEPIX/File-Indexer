[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaengine-qol-contract"
version = "0.1.0"
description = "Declarative API and filter contract for MediaEngine frontends"
requires-python = ">=3.11"

[project.scripts]
mediaengine-qol = "mediaengine_qol.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

