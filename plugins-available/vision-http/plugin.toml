[plugin]
id = "acme.vision"
version = "1.1.0"
transport = "http"
accepts = ["image", "video"]
emits = ["vision.face", "vision.object"]
depends_on = []
model_id = "facenet-vggface2+fasterrcnn-resnet50-fpn-v2"
description = "Local face embeddings plus torchvision and multi-model Caffe detection"
transfer = "both"
embedding_dim = 512

[plugin.requires]
pixels = true
frames = true
audio = false
text = false
metadata_only = false
# CUDA is supported but optional. Setting this true would incorrectly prevent
# the engine from scheduling the analyzer on a CPU-only installation.
gpu = false
network = true
max_concurrency = 1

[plugin.http]
base_url = "http://vision:9200"
auth_token = ""
timeout_s = 180.0
health_path = "/health"
manifest_path = "/manifest"
analyze_path = "/analyze"

[plugin.namespaces."vision.face"]
display_name = "Detected faces"
value_type = "categorical"
facetable = true
embedding_dim = 512

[plugin.namespaces."vision.object"]
display_name = "Detected objects"
value_type = "categorical"
facetable = true
