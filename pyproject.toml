[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaengine"
version = "0.1.0"
description = "Local-first, plugin-driven media indexing engine"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MediaEngine contributors" }]
keywords = ["media", "indexing", "photos", "video", "exif", "search"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia",
  "Topic :: Database :: Database Engines/Servers",
]

# Core dependencies. Deliberately small: the engine must be embeddable in a
# PyQt app without dragging in a web stack or ML runtime.
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "Pillow>=10.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Fast content hashing. Falls back to hashlib.sha256 when absent.
hash = ["blake3>=0.4"]
# Magic-byte media type detection. Falls back to a builtin sniffer.
detect = ["filetype>=1.2", "python-magic>=0.4.27"]
# Document text extraction.
documents = ["PyMuPDF>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "EbookLib>=0.18"]
# HTTP API service.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0", "python-multipart>=0.0.9"]
# HTTP-transport remote plugins.
remote = ["httpx>=0.27"]
# Accelerated vector search. Falls back to NumPy brute force.
vec = ["sqlite-vec>=0.1.1"]
# Modern Qt desktop frontend. The classic Tk V1 remains dependency-free.
studio = ["PySide6>=6.7,<7"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.9",
  "types-PyYAML",
  "httpx>=0.27",
]
all = [
  "mediaengine[hash,detect,documents,api,remote,vec]",
]

[project.scripts]
mediaengine = "mediaengine.cli:main"

[project.gui-scripts]
mediaengine-v1 = "mediaengine.gui:main"
mediaengine-studio = "mediaengine.studio:main"

# Built-in analyzers are registered through the same entry-point group that
# third-party plugins use. There is no privileged path into the registry.
[project.entry-points."mediaengine.analyzers"]
"core.exif-entities" = "mediaengine.plugins.builtin.exif_entities:ExifEntitiesAnalyzer"
"core.exif-gps" = "mediaengine.plugins.builtin.exif_gps:ExifGpsAnalyzer"
"core.visual-signals" = "mediaengine.plugins.builtin.visual_signals:VisualSignalsAnalyzer"
"example.stub-classifier" = "mediaengine.plugins.builtin.stub_classifier:StubClassifier"
"local.lm-studio" = "mediaengine.plugins.builtin.lm_studio:LmStudioAnalyzer"

[tool.setuptools.packages.find]
where = [".", "qol_contract/src"]
include = ["mediaengine*", "mediaengine_qol*"]

[tool.setuptools.package-data]
mediaengine = ["db/migrations/*.sql", "filters/builtin/*.toml", "py.typed"]
mediaengine_qol = ["py.typed"]

[tool.setuptools.data-files]
"share/mediaengine" = ["qol_contract/change_sheet.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
namespace_packages = true
explicit_package_bases = true
exclude = ['^examples/', '^build/', '^stubs/']
# `stubs/` shadows NumPy's own stubs, which use Python 3.12 syntax that mypy
# cannot parse under a 3.11 target. See stubs/numpy/__init__.pyi.
mypy_path = "stubs:qol_contract/src"

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = [
  "blake3.*", "filetype.*", "magic.*", "fitz.*", "pymupdf.*",
  "docx.*", "openpyxl.*", "ebooklib.*", "sqlite_vec.*", "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules are written to type-check on every supported platform and with
# every optional dependency present or absent. Their `type: ignore` comments
# are therefore correct but *conditionally* redundant: `subprocess.CREATE_NO_WINDOW`
# resolves on Windows and not on Linux, PyMuPDF's stubs exist only when PyMuPDF
# is installed. Flagging those as unused would push a developer to delete an
# ignore that the next platform needs.
module = [
  "mediaengine.core.procs",
  "mediaengine.core.walker",
  "mediaengine.core.derivatives",
  "mediaengine.core.extractors.documents",
  "mediaengine.db.connection",
  "mediaengine.plugins.contract",
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# PyMuPDF ships partially annotated stubs whose constructors are untyped. The
# call sites are guarded and their results are validated; refusing to call them
# is not an option and wrapping each one adds noise, not safety.
module = ["mediaengine.core.derivatives", "mediaengine.core.extractors.documents"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: tests that spawn subprocesses or sleep",
  "requires_ffmpeg: needs ffmpeg/ffprobe on PATH",
  "requires_exiftool: needs exiftool on PATH",
]
